<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO活動資料庫(手機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <div class="max-w-2xl mx-auto">
        <!-- 最上方：分類 -->
        <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-4 z-20">
            <div class="flex items-center gap-3 mb-4">
                <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                     alt="圖標" class="w-10 h-10 object-contain rounded-2xl">
                <h1 class="text-2xl font-bold">活動資料庫</h1>
            </div>
            <div id="categoryList" class="flex flex-wrap gap-2"></div>
        </div>

        <!-- 中間：分頁列表（可隱藏/展開） -->
        <div id="subpageSection" class="border-b border-slate-700 bg-slate-900 p-4 hidden">
            <div class="flex justify-between items-center mb-3">
                <h3 id="currentCategoryName" class="font-medium text-lg">分類名稱</h3>
                <button onclick="toggleSubpageList()" class="text-slate-400 text-sm">收合 ▲</button>
            </div>
            <div id="subpageList" class="space-y-2"></div>
        </div>

        <!-- 下方：內容顯示區 -->
        <div class="p-5" id="contentArea">
            <div id="pageContent" class="min-h-[60vh]"></div>
        </div>
    </div>

    <script>
        let categories = [];
        let currentCategoryIndex = 0;
        let isSubpageVisible = false;

        async function loadPublicData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Nerine52/game-database/main/public-data.json');
                if (!response.ok) throw new Error("No data");
                categories = await response.json();
                renderCategories();
                if (categories.length > 0) selectCategory(0);
            } catch (e) {
                document.getElementById("pageContent").innerHTML = `
                    <div class="text-center py-32 text-slate-400">
                        <p class="text-xl">資料尚未準備好</p>
                        <p class="mt-4">請在編輯版匯出後上傳 public-data.json</p>
                    </div>`;
            }
        }

        function renderCategories() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, index) => {
                const btn = document.createElement("button");
                btn.className = `px-5 py-3 rounded-3xl text-sm font-medium transition-all ${index === currentCategoryIndex ? 'bg-blue-600 text-white' : 'bg-slate-800 hover:bg-slate-700'}`;
                btn.textContent = cat.name;
                btn.onclick = () => selectCategory(index);
                container.appendChild(btn);
            });
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            renderCategories();
            document.getElementById("currentCategoryName").textContent = categories[index].name;
            
            // 顯示中間分頁列表
            document.getElementById("subpageSection").classList.remove("hidden");
            isSubpageVisible = true;
            renderSubpageList();
            showSubpage(0);
        }

        function renderSubpageList() {
            const container = document.getElementById("subpageList");
            container.innerHTML = "";

            const subpages = categories[currentCategoryIndex].subpages || [];
            subpages.forEach((sub, index) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all ${index === 0 ? 'bg-slate-800' : 'hover:bg-slate-800'}`;
                div.textContent = sub.title;
                div.onclick = () => showSubpage(index);
                container.appendChild(div);
            });
        }

        function toggleSubpageList() {
            isSubpageVisible = !isSubpageVisible;
            const section = document.getElementById("subpageSection");
            if (isSubpageVisible) {
                section.classList.remove("hidden");
            } else {
                section.classList.add("hidden");
            }
        }

        function showSubpage(index) {
            const sub = categories[currentCategoryIndex].subpages[index];
            if (!sub) return;

            const container = document.getElementById("pageContent");
            container.innerHTML = `<h3 class="text-2xl font-bold mb-8 text-white">${sub.title}</h3>`;

            (sub.blocks || []).forEach(block => {
                if (block.type === "text" && block.content) {
                    const div = document.createElement("div");
                    div.className = "prose prose-invert text-slate-300 mb-10 leading-relaxed";
                    div.innerHTML = block.content.replace(/\n/g, '<br><br>');
                    container.appendChild(div);
                } else if (block.type === "table") {
                    let html = `<div class="mb-10"><div class="font-medium mb-4 text-slate-100">${block.title || "資料表格"}</div>`;
                    html += "<div class='overflow-x-auto'><table class='w-full border-collapse text-sm'>";
                    html += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-4 bg-slate-800 text-slate-200'>${h}</th>`).join("") + "</tr></thead><tbody>";
                    block.rows.forEach(row => {
                        html += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-4 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                    });
                    html += "</tbody></table></div></div>";
                    container.innerHTML += html;
                }
            });
        }

        window.onload = loadPublicData;
    </script>
</body>
</html>
