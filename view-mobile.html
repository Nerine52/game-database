<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活動資料庫(手機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 48px; width: 48px; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-12">
    <div class="max-w-2xl mx-auto p-5">
        <!-- 頂部標題 -->
        <div class="flex items-center gap-3 mb-8 sticky top-0 bg-slate-950 py-4 z-10 border-b border-slate-800">
            <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                 alt="圖標" class="w-10 h-10 object-contain rounded-2xl">
            <h1 class="text-2xl font-bold">活動資料庫</h1>
        </div>

        <div id="mainContent" class="space-y-10"></div>

        <div id="noData" class="hidden text-center py-24">
            <p class="text-2xl text-slate-400 mb-4">目前沒有資料</p>
            <p class="text-slate-500 leading-relaxed">
                請先用電腦打開編輯版<br>
                完成資料並點擊「儲存此分頁」<br>
                然後再重新整理此頁
            </p>
        </div>
    </div>

    <script>
        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            const mainContent = document.getElementById("mainContent");
            const noData = document.getElementById("noData");

            if (!saved) {
                noData.classList.remove("hidden");
                return;
            }

            try {
                const categories = JSON.parse(saved);
                mainContent.innerHTML = "";

                categories.forEach(cat => {
                    const section = document.createElement("div");
                    section.className = "bg-slate-900 rounded-3xl p-6";
                    section.innerHTML = `<h2 class="text-2xl font-bold mb-7 text-white">${cat.name}</h2>`;

                    const subpages = cat.subpages || [];
                    if (subpages.length === 0) {
                        section.innerHTML += `<p class="text-slate-500 italic pl-2">此分類沒有分頁</p>`;
                    } else {
                        subpages.forEach(sub => {
                            const subDiv = document.createElement("div");
                            subDiv.className = "mb-10 last:mb-0";
                            subDiv.innerHTML = `<h3 class="text-xl font-semibold mb-5 text-slate-100">${sub.title}</h3>`;

                            const blocks = sub.blocks || [];
                            blocks.forEach(block => {
                                if (block.type === "text" && block.content) {
                                    const textDiv = document.createElement("div");
                                    textDiv.className = "prose prose-invert text-slate-300 mb-8 leading-relaxed";
                                    textDiv.innerHTML = block.content.replace(/\n/g, '<br><br>');
                                    subDiv.appendChild(textDiv);
                                } else if (block.type === "table") {
                                    let tableHTML = `<div class="mb-8"><div class="font-medium mb-4 text-slate-200">${block.title || "資料表格"}</div>`;
                                    tableHTML += `<div class="overflow-x-auto pb-2"><table class="w-full border-collapse text-sm">`;
                                    tableHTML += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-3.5 bg-slate-800 text-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                                    block.rows.forEach(row => {
                                        tableHTML += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-3.5 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                                    });
                                    tableHTML += "</tbody></table></div></div>";
                                    subDiv.innerHTML += tableHTML;
                                }
                            });
                            section.appendChild(subDiv);
                        });
                    }
                    mainContent.appendChild(section);
                });
            } catch (e) {
                noData.classList.remove("hidden");
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
