<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO活動資料庫(手機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-2xl mx-auto p-4">
        <div class="flex items-center gap-3 mb-8 sticky top-0 bg-slate-950 py-4">
            <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                 alt="圖標" class="w-10 h-10 object-contain rounded-2xl">
            <h1 class="text-2xl font-bold">活動資料庫</h1>
        </div>

        <div id="mainContent"></div>

        <div id="noData" class="hidden text-center py-20">
            <p class="text-xl text-slate-400">目前沒有資料</p>
            <p class="mt-3 text-slate-500">請先在電腦的編輯版儲存資料後，再重新整理此頁</p>
        </div>
    </div>

    <script>
        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            const main = document.getElementById("mainContent");
            const noData = document.getElementById("noData");

            if (!saved) {
                noData.classList.remove("hidden");
                return;
            }

            const categories = JSON.parse(saved);
            main.innerHTML = "";

            categories.forEach(cat => {
                const section = document.createElement("div");
                section.className = "mb-12 bg-slate-900 rounded-3xl p-6";
                section.innerHTML = `<h2 class="text-2xl font-bold mb-6 text-white">${cat.name}</h2>`;

                (cat.subpages || []).forEach(sub => {
                    const subDiv = document.createElement("div");
                    subDiv.className = "mb-10";
                    subDiv.innerHTML = `<h3 class="text-xl font-semibold mb-5 text-slate-100">${sub.title}</h3>`;

                    (sub.blocks || []).forEach(block => {
                        if (block.type === "text" && block.content) {
                            const t = document.createElement("div");
                            t.className = "prose prose-invert text-slate-300 mb-8";
                            t.innerHTML = block.content.replace(/\n/g, '<br>');
                            subDiv.appendChild(t);
                        } else if (block.type === "table") {
                            let tHTML = `<div class="mb-6"><div class="font-medium mb-3">${block.title || "資料表格"}</div>`;
                            tHTML += `<div class="overflow-x-auto"><table class="w-full border-collapse text-sm">`;
                            tHTML += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-3 bg-slate-800 text-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                            block.rows.forEach(row => {
                                tHTML += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-3 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                            });
                            tHTML += "</tbody></table></div></div>";
                            subDiv.innerHTML += tHTML;
                        }
                    });
                    section.appendChild(subDiv);
                });
                main.appendChild(section);
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
