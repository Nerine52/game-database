<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO活動資料庫(手機版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 48px; width: 48px; object-fit: contain; border-radius: 6px; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <div class="max-w-2xl mx-auto p-5">
        <!-- 頂部標題 -->
        <div class="flex items-center gap-3 mb-8 sticky top-0 bg-slate-950 py-5 z-10 border-b border-slate-800">
            <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                 alt="圖標" class="w-11 h-11 object-contain rounded-2xl">
            <h1 class="text-2xl font-bold">活動資料庫</h1>
        </div>

        <div id="mainContent" class="space-y-12"></div>

        <div id="noData" class="hidden text-center py-28">
            <p class="text-2xl text-slate-400 mb-4">目前沒有資料</p>
            <p class="text-slate-500">請先在電腦的編輯版完成資料並匯出，<br>然後上傳 public-data.json 後再刷新此頁</p>
        </div>
    </div>

    <script>
        async function loadPublicData() {
            const mainContent = document.getElementById("mainContent");
            const noData = document.getElementById("noData");

            try {
                const response = await fetch('https://raw.githubusercontent.com/Nerine52/game-database/main/public-data.json');
                if (!response.ok) throw new Error("No data");

                const categories = await response.json();
                mainContent.innerHTML = "";

                categories.forEach(cat => {
                    const section = document.createElement("div");
                    section.className = "bg-slate-900 rounded-3xl p-6";
                    section.innerHTML = `<h2 class="text-2xl font-bold mb-7 text-white">${cat.name}</h2>`;

                    (cat.subpages || []).forEach(sub => {
                        const subDiv = document.createElement("div");
                        subDiv.className = "mb-10";
                        subDiv.innerHTML = `<h3 class="text-xl font-semibold mb-6 text-slate-100">${sub.title}</h3>`;

                        (sub.blocks || []).forEach(block => {
                            if (block.type === "text" && block.content) {
                                const t = document.createElement("div");
                                t.className = "prose prose-invert text-slate-300 mb-8 leading-relaxed";
                                t.innerHTML = block.content.replace(/\n/g, '<br><br>');
                                subDiv.appendChild(t);
                            } else if (block.type === "table") {
                                let tableHTML = `<div class="mb-8"><div class="font-medium mb-4 text-slate-200">${block.title || "資料表格"}</div>`;
                                tableHTML += `<div class="overflow-x-auto"><table class="w-full border-collapse text-sm">`;
                                tableHTML += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-4 bg-slate-800 text-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                                block.rows.forEach(row => {
                                    tableHTML += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-4 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                                });
                                tableHTML += "</tbody></table></div></div>";
                                subDiv.innerHTML += tableHTML;
                            }
                        });
                        section.appendChild(subDiv);
                    });
                    mainContent.appendChild(section);
                });
            } catch (e) {
                noData.classList.remove("hidden");
            }
        }

        window.onload = loadPublicData;
    </script>
</body>
</html>
