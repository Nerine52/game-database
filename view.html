<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的遊戲資料庫 - 預覽版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; }
        .tab-active { background-color: #1e40af; color: white; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- 左側分類 -->
        <div class="w-72 bg-slate-900 text-white p-6 flex flex-col">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 bg-blue-500 rounded-2xl flex items-center justify-center text-3xl">📚</div>
                <h1 class="text-2xl font-bold">遊戲資料庫</h1>
            </div>
            <div id="categoryList" class="flex-1 space-y-2"></div>
        </div>

        <!-- 右側內容 -->
        <div class="flex-1 flex flex-col">
            <!-- 分類標題 -->
            <div class="h-16 bg-white border-b flex items-center px-8">
                <h2 id="currentCategoryName" class="text-3xl font-bold">通行證</h2>
            </div>

            <!-- 分頁按鈕列 -->
            <div id="subpageTabs" class="h-16 bg-white border-b flex items-center px-8 gap-3 overflow-x-auto"></div>

            <!-- 內容顯示區 -->
            <div class="flex-1 p-10 overflow-auto" id="contentArea">
                <div id="pageContent" class="max-w-5xl mx-auto"></div>
            </div>
        </div>
    </div>

    <script>
        let categories = [];

        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            if (saved) {
                categories = JSON.parse(saved);
                renderCategories();
                if (categories.length > 0) {
                    selectCategory(0);
                }
            } else {
                document.getElementById("pageContent").innerHTML = `
                    <div class="text-center py-32 text-slate-400">
                        <p class="text-xl">尚未有資料</p>
                        <p class="mt-2">請先在編輯版儲存資料後再刷新此頁</p>
                    </div>`;
            }
        }

        function renderCategories() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, index) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all hover:bg-slate-800 ${index === 0 ? 'bg-slate-700' : ''}`;
                div.textContent = cat.name;
                div.onclick = () => selectCategory(index);
                container.appendChild(div);
            });
        }

        let currentCategoryIndex = 0;
        let currentSubpageIndex = 0;

        function selectCategory(index) {
            currentCategoryIndex = index;
            currentSubpageIndex = 0;
            renderCategories();
            document.getElementById("currentCategoryName").textContent = categories[index].name;
            renderSubpageTabs();
            showSubpage(0);
        }

        function renderSubpageTabs() {
            const container = document.getElementById("subpageTabs");
            container.innerHTML = "";

            const subpages = categories[currentCategoryIndex].subpages || [];
            
            subpages.forEach((sub, index) => {
                const btn = document.createElement("button");
                btn.className = `px-6 py-3 text-sm font-medium rounded-3xl whitespace-nowrap transition-all ${index === currentSubpageIndex ? 'tab-active' : 'hover:bg-slate-100'}`;
                btn.textContent = sub.title;
                btn.onclick = () => {
                    currentSubpageIndex = index;
                    renderSubpageTabs();
                    showSubpage(index);
                };
                container.appendChild(btn);
            });
        }

        function showSubpage(index) {
            const sub = categories[currentCategoryIndex].subpages[index];
            const container = document.getElementById("pageContent");
            container.innerHTML = `<h3 class="text-2xl font-bold mb-8">${sub.title}</h3>`;

            if (!sub.blocks || sub.blocks.length === 0) {
                container.innerHTML += `<p class="text-slate-400">此分頁沒有內容</p>`;
                return;
            }

            sub.blocks.forEach(block => {
                if (block.type === "text" && block.content) {
                    const div = document.createElement("div");
                    div.className = "prose prose-slate max-w-none mb-12";
                    div.innerHTML = block.content;
                    container.appendChild(div);
                } 
                else if (block.type === "table") {
                    let html = `<div class="mb-8"><div class="font-medium mb-3 text-lg">${block.title || "資料表格"}</div>`;
                    html += "<table class='w-full border-collapse text-sm'>";
                    html += "<thead><tr>" + block.headers.map(h => `<th class='border p-4 bg-slate-100 font-medium'>${h}</th>`).join("") + "</tr></thead><tbody>";
                    block.rows.forEach(row => {
                        html += "<tr>" + row.map(cell => `<td class='border p-4'>${cell || ''}</td>`).join("") + "</tr>";
                    });
                    html += "</tbody></table></div>";
                    container.innerHTML += html;
                }
            });
        }

        // 初始化
        window.onload = loadData;
    </script>
</body>
</html>
