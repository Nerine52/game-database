<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO活動資料庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="max-w-5xl mx-auto p-6">
        <div class="flex justify-between items-center mb-10 border-b border-slate-700 pb-6">
            <div class="flex items-center gap-3">
                <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                     alt="圖標" class="w-12 h-12 object-contain rounded-2xl">
                <h1 class="text-3xl font-bold">活動資料庫</h1>
            </div>
            <div class="text-xs text-slate-500">公開預覽版 • 實時更新</div>
        </div>

        <div id="content" class="space-y-16"></div>
    </div>

    <script>
        async function loadPublicData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Nerine52/game-database/main/public-data.json');
                if (!response.ok) throw new Error("檔案不存在");
                
                const categories = await response.json();
                const container = document.getElementById("content");
                container.innerHTML = "";

                categories.forEach(cat => {
                    const catDiv = document.createElement("div");
                    catDiv.className = "bg-slate-900 rounded-3xl p-8";
                    catDiv.innerHTML = `<h2 class="text-3xl font-bold mb-8 text-white">${cat.name}</h2>`;

                    (cat.subpages || []).forEach(sub => {
                        const subDiv = document.createElement("div");
                        subDiv.className = "mb-12";
                        subDiv.innerHTML = `<h3 class="text-2xl font-semibold mb-6 text-slate-100">${sub.title}</h3>`;

                        (sub.blocks || []).forEach(block => {
                            if (block.type === "text" && block.content) {
                                const textDiv = document.createElement("div");
                                textDiv.className = "prose prose-invert text-slate-300 mb-10 leading-relaxed";
                                textDiv.innerHTML = block.content.replace(/\n/g, '<br><br>');
                                subDiv.appendChild(textDiv);
                            } else if (block.type === "table") {
                                let html = `<div class="mb-10"><div class="font-medium text-lg mb-4 text-slate-100">${block.title || "資料表格"}</div>`;
                                html += "<table class='w-full border-collapse text-sm'>";
                                html += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-4 bg-slate-800 text-slate-200'>${h}</th>`).join("") + "</tr></thead><tbody>";
                                block.rows.forEach(row => {
                                    html += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-4 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                                });
                                html += "</tbody></table></div>";
                                subDiv.innerHTML += html;
                            }
                        });
                        catDiv.appendChild(subDiv);
                    });
                    container.appendChild(catDiv);
                });
            } catch (e) {
                document.getElementById("content").innerHTML = `
                    <div class="text-center py-32 text-slate-400">
                        <p class="text-2xl">資料尚未準備好</p>
                        <p class="mt-4">請在編輯版點擊「匯出給公開版」後上傳 public-data.json</p>
                    </div>`;
            }
        }

        window.onload = loadPublicData;
    </script>
</body>
</html>
