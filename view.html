<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO活動資料庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 md:p-6">
        <div class="flex items-center gap-3 mb-8">
            <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                 alt="圖標" class="w-12 h-12 object-contain rounded-2xl">
            <h1 class="text-3xl font-bold">活動資料庫</h1>
        </div>

        <div id="mainContent">
            <!-- 資料會在這裡顯示 -->
        </div>

        <div id="noData" class="hidden text-center py-20">
            <p class="text-2xl text-slate-400 mb-4">目前沒有資料</p>
            <p class="text-slate-500">請先在編輯版（index.html）完成資料並儲存，然後重新整理此頁</p>
        </div>
    </div>

    <script>
        function loadAndRender() {
            const saved = localStorage.getItem("gameDatabase");
            const mainContent = document.getElementById("mainContent");
            const noData = document.getElementById("noData");

            if (!saved) {
                noData.classList.remove("hidden");
                mainContent.classList.add("hidden");
                return;
            }

            const categories = JSON.parse(saved);
            mainContent.innerHTML = "";
            noData.classList.add("hidden");

            categories.forEach(cat => {
                const catSection = document.createElement("div");
                catSection.className = "mb-12 bg-slate-900 rounded-3xl p-6 md:p-8";
                catSection.innerHTML = `<h2 class="text-2xl font-bold mb-8 text-white border-b border-slate-700 pb-4">${cat.name}</h2>`;

                if (!cat.subpages || cat.subpages.length === 0) {
                    catSection.innerHTML += `<p class="text-slate-500 italic">此分類沒有分頁</p>`;
                } else {
                    cat.subpages.forEach(sub => {
                        const subDiv = document.createElement("div");
                        subDiv.className = "mb-10";
                        subDiv.innerHTML = `<h3 class="text-xl font-semibold mb-6 text-slate-100">${sub.title}</h3>`;

                        if (sub.blocks && sub.blocks.length > 0) {
                            sub.blocks.forEach(block => {
                                if (block.type === "text" && block.content) {
                                    const textDiv = document.createElement("div");
                                    textDiv.className = "prose prose-invert max-w-none mb-8 text-slate-300 leading-relaxed";
                                    textDiv.innerHTML = block.content.replace(/\n/g, '<br>');
                                    subDiv.appendChild(textDiv);
                                } 
                                else if (block.type === "table") {
                                    let tableHTML = `<div class="mb-6"><div class="font-medium mb-3 text-slate-200">${block.title || "資料表格"}</div>`;
                                    tableHTML += `<div class="overflow-x-auto"><table class="w-full border-collapse text-sm">`;
                                    tableHTML += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-700 p-3 bg-slate-800 text-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                                    block.rows.forEach(row => {
                                        tableHTML += "<tr>" + row.map(cell => `<td class='border border-slate-700 p-3 text-slate-300'>${cell || ''}</td>`).join("") + "</tr>";
                                    });
                                    tableHTML += "</tbody></table></div></div>";
                                    subDiv.innerHTML += tableHTML;
                                }
                            });
                        }
                        catSection.appendChild(subDiv);
                    });
                }
                mainContent.appendChild(catSection);
            });
        }

        window.onload = loadAndRender;
    </script>
</body>
</html>
