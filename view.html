<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動資料庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; }
        .subpage-active { background-color: #1e3a8a; border-left: 4px solid #60a5fa; }

        /* Markdown 顯示樣式 */
        .prose h1 { font-size: 2.25rem; font-weight: 700; margin: 1.25em 0 0.5em; }
        .prose h2 { font-size: 1.875rem; font-weight: 600; margin: 1.25em 0 0.5em; }
        .prose p { margin: 1em 0; line-height: 1.8; }
        .prose ul { list-style-type: disc; padding-left: 1.8em; margin: 1em 0; }
        .prose ol { list-style-type: decimal; padding-left: 1.8em; margin: 1em 0; }
        .prose li { margin: 0.4em 0; }

        /* === 表格樣式加強 === */
        table { width: 100%; border-collapse: collapse; }
        th, td { 
            padding: 16px 12px; 
            border: 1px solid #334155; 
            text-align: center; 
            vertical-align: middle; 
            white-space: pre-wrap;
        }
        th { background-color: #1e2937; font-weight: 600; }

        /* 關鍵修正：讓表格內的圖片上下左右置中 */
        td img {
            display: block;
            margin: 0 auto;           /* 水平置中 */
            max-width: 100%;          /* 不超過格子寬度 */
            max-height: 220px;        /* 可自行調整高度上限 */
            object-fit: contain;      /* 保持圖片比例 */
        }

        /* 如果圖片較大，也強制垂直置中 */
        td {
            display: table-cell;      /* 確保 vertical-align 生效 */
        }
        
        /* View版浮動展開/收合按鈕 */
        #floatingToggleBtn {
            transition: all 0.3s ease;
        }
        #floatingToggleBtn:hover {
            transform: scale(1.1) translateY(-50%);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }
        
    </style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="flex h-screen overflow-hidden">
        <!-- 左側：分類 -->
            <div id="leftPanel" class="w-64 bg-slate-900 border-r border-slate-700 p-6 flex flex-col transition-all duration-300 overflow-hidden">
            <div class="flex items-center gap-3 mb-10">
                <img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/imgi_25_bi-bnsneo-type1.png" 
                     alt="圖標" class="w-11 h-11 object-contain rounded-2xl">
                <h1 class="text-2xl font-bold">活動資料庫</h1>
            </div>
            <div id="categoryList" class="flex-1 space-y-2"></div>
        </div>

        <!-- 中間：分頁列表 -->
        <div id="middlePanel" class="w-72 bg-slate-900 border-r border-slate-700 overflow-auto transition-all duration-300">
            <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-6">
                <h3 id="categoryTitle" class="font-medium text-xl text-white">分類名稱</h3>
            </div>
            <div id="subpageList" class="p-4"></div>
        </div>

        <!-- 右側：內容顯示區 -->
        <div class="flex-1 flex flex-col overflow-hidden bg-slate-950">
            <div class="h-16 bg-slate-900 border-b border-slate-700 flex items-center px-8">
                <h2 id="subpageTitleDisplay" class="text-3xl font-bold text-white">請選擇分頁</h2>
            </div>
            
            <div class="flex-1 p-10 overflow-auto" id="contentArea">
                <div id="pageContent" class="max-w-4xl mx-auto"></div>
            </div>
        </div>
    </div>

        <!-- View版浮動展開/收合按鈕 -->
    <button onclick="toggleViewSidebar()" id="floatingToggleBtn"
            class="hidden fixed left-4 top-1/2 -translate-y-1/2 bg-slate-800 hover:bg-slate-700 text-white w-14 h-14 rounded-3xl shadow-2xl flex items-center justify-center text-3xl z-[9999] border border-slate-600">
        <span id="floatIcon">→</span>
    </button>
    
        </div>

    <script>
        let categories = [];

        async function loadPublicData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/Nerine52/game-database/main/public-data.json');
                if (!response.ok) throw new Error("No data");
                categories = await response.json();

                // === 新增：強制把「注意事項」分類排在最前面 ===
                const noticeCategory = {
                    id: Date.now(),
                    name: "注意事項",
                    subpages: [
                        {
                            title: "注意事項",
                            blocks: [
                                { 
                                    type: "text", 
                                    content: "**重要注意事項**\n\n- 請務必遵守遊戲規則\n- 活動期間請保持良好互動\n- 如有問題請聯絡管理員\n- 禁止任何外掛、刷取、惡意行為", 
                                    fontSize: "medium" 
                                }
                            ]
                        }
                    ]
                };

                // 如果第一個分類已經是「注意事項」，就不要重複加入
                if (categories.length === 0 || categories[0].name !== "注意事項") {
                    categories.unshift(noticeCategory);
                }

                renderCategories();
                selectCategory(0);   // 強制顯示第一個分類（注意事項）的第一個分頁
            } catch (e) {
                document.getElementById("pageContent").innerHTML = `
                    <div class="text-center py-40 text-slate-400">
                        <p class="text-2xl">資料尚未準備好</p>
                        <p class="mt-4">請在編輯版點擊「匯出給公開版」後上傳 public-data.json</p>
                    </div>`;
            }
        }

        function renderCategories(selectedIndex = 0) {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";

            categories.forEach((cat, index) => {
                const div = document.createElement("div");
                // 正確判斷目前選取的分類
                const isActive = (index === selectedIndex);
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all hover:bg-slate-800 ${isActive ? 'bg-slate-700' : ''}`;
                div.textContent = cat.name;
                div.onclick = () => selectCategory(index);
                container.appendChild(div);
            });
        }

        let currentCategoryIndex = 0;
        let currentSubpageIndex = 0;

        function selectCategory(index) {
            currentCategoryIndex = index;
            currentSubpageIndex = 0;

            // 正確傳入目前選取的分類 index，讓高亮跟隨移動
            renderCategories(index);

            document.getElementById("categoryTitle").textContent = categories[index].name;
            renderSubpageList();
            showSubpage(0);
        }

        function renderSubpageList() {
            const container = document.getElementById("subpageList");
            container.innerHTML = "";

            const subpages = categories[currentCategoryIndex].subpages || [];
            subpages.forEach((sub, index) => {
                const div = document.createElement("div");
                div.className = `subpage-item px-6 py-4 rounded-2xl cursor-pointer mb-2 ${index === currentSubpageIndex ? 'subpage-active' : 'hover:bg-slate-800'}`;
                div.textContent = sub.title;
                div.onclick = () => {
                    currentSubpageIndex = index;
                    renderSubpageList();
                    showSubpage(index);
                };
                container.appendChild(div);
            });
        }

        function showSubpage(index) {
            const sub = categories[currentCategoryIndex].subpages[index];
            if (!sub) return;

            document.getElementById("subpageTitleDisplay").textContent = sub.title;
            const container = document.getElementById("pageContent");
            container.innerHTML = "";

            (sub.blocks || []).forEach(block => {
                if (block.type === "text" && block.content) {
                    const div = document.createElement("div");
                    const sizeStyle = block.fontSize === "small" ? "font-size:14px;line-height:1.6;" 
                                   : block.fontSize === "large" ? "font-size:20px;line-height:1.6;" 
                                   : "font-size:16px;line-height:1.7;";
                    div.className = `prose prose-invert max-w-none mb-12`;
                    div.style.cssText = sizeStyle;
                    div.innerHTML = marked.parse(block.content || "");
                    container.appendChild(div);
                } 
                else if (block.type === "table") {
                    let html = `<div class="mb-12"><div class="font-medium text-xl mb-5">${block.title || "資料表格"}</div>`;
                    html += "<table class='w-full border-collapse text-sm'>";

                    // === 表頭（支援 colspan）===
                    html += "<thead><tr>";
                    let c = 0;
                    while (c < block.headers.length) {
                        let header = block.headers[c] || '';
                        let colspan = 1;
                        let content = header.replace(/\n/g, '<br>');

                        if (typeof header === 'string' && header.includes('【COLSPAN:')) {
                            const match = header.match(/【COLSPAN:(\d+)】(.*)/);
                            if (match) {
                                colspan = parseInt(match[1]);
                                content = match[2] || '';
                            }
                        }

                        html += `<th colspan="${colspan}" class="border border-slate-700 p-4 bg-slate-800 text-slate-200">${content}</th>`;
                        c += colspan;
                    }
                    html += "</tr></thead><tbody>";

                    // === 資料列（支援 rowspan + Markdown）===
                    let r = 0;
                    while (r < block.rows.length) {
                        html += "<tr>";
                        let col = 0;
                        while (col < block.headers.length) {
                            if (isCoveredByRowspan(block, r, col)) {
                                col++;
                                continue;
                            }

                            let cell = block.rows[r][col] || '';
                            let content = cell.replace(/\n/g, '<br>');

                            // === 關鍵修正：讓表格內 Markdown 生效 ===
                            content = marked.parseInline(content);

                            let rowspan = 1;
                            if (typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                                const match = cell.match(/【ROWSPAN:(\d+)】(.*)/);
                                if (match) {
                                    rowspan = parseInt(match[1]);
                                    content = marked.parseInline(match[2] || '');
                                }
                            }

                            html += `<td rowspan="${rowspan}" class="border border-slate-700 p-4 text-slate-300">${content}</td>`;
                            col++;
                        }
                        html += "</tr>";
                        r++;
                    }
                    html += "</tbody></table></div>";
                    container.innerHTML += html;
                }
            });
        }

        // 判斷是否被上方 rowspan 涵蓋（必須保留）
        function isCoveredByRowspan(block, rowIdx, colIdx = 0) {
            if (colIdx !== 0) return false;
            let r = 0;
            while (r < rowIdx) {
                const cell = block.rows[r][0];
                if (typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                    const match = cell.match(/【ROWSPAN:(\d+)】/);
                    if (match) {
                        const span = parseInt(match[1]);
                        if (r + span > rowIdx) return true;
                    }
                }
                r++;
            }
            return false;
        }

        // 判斷是否被 rowspan 涵蓋（與編輯版相同）
        function isCoveredByRowspan(block, rowIdx, colIdx = 0) {
            if (colIdx !== 0) return false;
            let r = 0;
            while (r < rowIdx) {
                const cell = block.rows[r][0];
                if (typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                    const match = cell.match(/【ROWSPAN:(\d+)】/);
                    if (match) {
                        const span = parseInt(match[1]);
                        if (r + span > rowIdx) return true;
                    }
                }
                r++;
            }
            return false;
        }
        
        let isViewSidebarVisible = true;

        function toggleViewSidebar() {
            isViewSidebarVisible = !isViewSidebarVisible;
            const leftPanel = document.getElementById("leftPanel");
            const middlePanel = document.getElementById("middlePanel");
            const floatBtn = document.getElementById("floatingToggleBtn");
            const icon = document.getElementById("floatIcon");

            if (isViewSidebarVisible) {
                // 展開
                leftPanel.style.display = "flex";
                middlePanel.style.display = "block";
                leftPanel.style.width = "256px";   // 你之前設定的寬度
                middlePanel.style.width = "288px";
                floatBtn.classList.add("hidden");
            } else {
                // 完全隱藏
                leftPanel.style.display = "none";
                middlePanel.style.display = "none";
                floatBtn.classList.remove("hidden");
                icon.textContent = "←";
            }
        }
        
        window.onload = () => {
            loadPublicData();
        };
    </script>
</body>
</html>
