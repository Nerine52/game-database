<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的遊戲資料庫 - Nerine52</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 4px; }
        .nav-active { background-color: #1e40af; color: white; }
        td, th { padding: 10px; border: 1px solid #e2e8f0; }
        td[contenteditable="true"]:focus, th[contenteditable="true"]:focus { 
            outline: 2px solid #3b82f6; background-color: #f0f9ff; 
        }
        .block-item { transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- 左側分類 -->
        <div class="w-72 bg-slate-900 text-white p-6 flex flex-col">
            <h1 class="text-2xl font-bold mb-8">📚 我的遊戲資料庫</h1>
            <div id="categoryList" class="flex-1 space-y-2"></div>
            <button onclick="addCategory()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl text-sm font-medium">+ 新增分類</button>
        </div>

        <!-- 中間分頁列表 -->
        <div class="w-80 bg-white border-r overflow-auto">
            <div class="sticky top-0 bg-white border-b p-5 flex justify-between items-center">
                <h3 class="font-medium">分頁列表</h3>
                <button onclick="addSubpage()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-3xl text-sm font-medium">
                    <span class="text-lg">+</span> 新增分頁
                </button>
            </div>
            <div id="subpageList" class="p-3"></div>
        </div>

        <!-- 右側內容 -->
        <div class="flex-1 flex flex-col">
            <div class="h-16 bg-white border-b flex items-center px-8">
                <h2 id="currentTitle" class="text-3xl font-bold">請選擇分頁</h2>
            </div>

            <div class="flex-1 p-8 overflow-auto bg-slate-50" id="contentArea">
                <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl p-8">
                    <input id="subpageTitle" class="w-full text-3xl font-bold border-b pb-3 focus:outline-none" placeholder="分頁標題" onblur="saveCurrent()">

                    <!-- 文字方塊與表格容器 -->
                    <div id="contentBlocks" class="mt-8 space-y-10"></div>

                    <!-- 新增按鈕區域 -->
                    <div class="mt-10 flex gap-4">
                        <button onclick="addTextBlock()" class="flex-1 bg-slate-100 hover:bg-slate-200 py-4 rounded-3xl text-sm font-medium">+ 新增文字方塊</button>
                        <button onclick="addNewTable()" class="flex-1 bg-slate-100 hover:bg-slate-200 py-4 rounded-3xl text-sm font-medium">+ 新增表格</button>
                    </div>
                </div>
            </div>

            <!-- 底部工具列 -->
            <div class="h-16 bg-white border-t flex items-center px-8 gap-4">
                <button onclick="previewContent()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-3xl text-sm">預覽</button>
                <button onclick="saveCurrent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-3xl text-sm">💾 儲存此分頁</button>
                <button onclick="deleteCurrentSubpage()" class="text-red-500 hover:text-red-600 px-5 py-3 text-sm">🗑️ 刪除分頁</button>
            </div>
        </div>
    </div>

    <!-- 預覽彈窗 -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-auto">
            <div class="p-6 border-b flex justify-between sticky top-0 bg-white">
                <h3 id="previewTitle" class="text-2xl font-bold"></h3>
                <button onclick="closePreview()" class="text-3xl text-slate-400">×</button>
            </div>
            <div id="previewBody" class="p-8"></div>
        </div>
    </div>

    <script>
        let categories = [
            { id: 1, name: "通行證", subpages: [] },
            { id: 2, name: "金幣箱", subpages: [] },
            { id: 3, name: "華仲師兄", subpages: [] },
            { id: 4, name: "服裝箱", subpages: [] },
            { id: 5, name: "福利活動", subpages: [] },
            { id: 6, name: "排行活動", subpages: [] }
        ];

        let currentCategoryIndex = 0;
        let currentSubpageIndex = -1;
        let currentBlocks = []; // 存放多個文字方塊與表格

        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            if (saved) categories = JSON.parse(saved);
        }

        function saveAllData() {
            localStorage.setItem("gameDatabase", JSON.stringify(categories));
        }

        function renderCategoryList() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, index) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all ${index === currentCategoryIndex ? 'nav-active' : 'hover:bg-slate-800'}`;
                div.textContent = cat.name;
                div.onclick = () => selectCategory(index);
                container.appendChild(div);
            });
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            currentSubpageIndex = -1;
            renderCategoryList();
            renderSubpageList();
            document.getElementById("currentTitle").textContent = categories[index].name + " - 請選擇分頁";
            document.getElementById("contentArea").classList.add("hidden");
        }

        function renderSubpageList() {
            const container = document.getElementById("subpageList");
            container.innerHTML = "";
            categories[currentCategoryIndex].subpages.forEach((sub, index) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 mx-2 rounded-2xl cursor-pointer hover:bg-slate-100 ${index === currentSubpageIndex ? 'bg-blue-50 border border-blue-200' : ''}`;
                div.textContent = sub.title;
                div.onclick = () => selectSubpage(index);
                container.appendChild(div);
            });
            if (categories[currentCategoryIndex].subpages.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400">此分類還沒有分頁<br>請點上方「+ 新增分頁」</div>`;
            }
        }

        function selectSubpage(index) {
            currentSubpageIndex = index;
            const sub = categories[currentCategoryIndex].subpages[index];
            document.getElementById("currentTitle").textContent = sub.title;
            document.getElementById("subpageTitle").value = sub.title || "";
            document.getElementById("textEditor").value = ""; // 暫時不用單一文字區

            currentBlocks = sub.blocks || [
                { type: "text", content: "在此輸入文字說明..." },
                { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
            ];

            renderAllBlocks();
            document.getElementById("contentArea").classList.remove("hidden");
            renderSubpageList();
        }

        function renderAllBlocks() {
            const container = document.getElementById("contentBlocks");
            container.innerHTML = "";

            currentBlocks.forEach((block, index) => {
                const div = document.createElement("div");
                div.className = "block-item border rounded-3xl p-6 bg-white relative";
                div.innerHTML = `
                    <div class="absolute right-4 top-4 flex gap-2">
                        <button onclick="moveBlock(${index}, -1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg">↑</button>
                        <button onclick="moveBlock(${index}, 1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg">↓</button>
                        <button onclick="deleteBlock(${index})" class="w-7 h-7 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg">×</button>
                    </div>
                `;

                if (block.type === "text") {
                    div.innerHTML += `
                        <textarea class="w-full h-52 p-6 border rounded-3xl text-lg resize-y" onblur="updateTextBlock(${index}, this.value)">${block.content || ""}</textarea>
                    `;
                } else if (block.type === "table") {
                    div.innerHTML += `
                        <input value="${block.title || '資料表格'}" class="text-xl font-medium bg-transparent border-b focus:outline-none px-2 py-1 w-64 mb-4" onblur="updateTableTitle(${index}, this.value)">
                        <div class="flex gap-3 mb-3">
                            <button onclick="addTableRow(${index})" class="bg-slate-100 hover:bg-slate-200 px-5 py-2 rounded-3xl text-sm">+ 新增列</button>
                            <button onclick="addTableColumn(${index})" class="bg-slate-100 hover:bg-slate-200 px-5 py-2 rounded-3xl text-sm">+ 新增欄</button>
                        </div>
                        <table class="w-full border" id="table-${index}"></table>
                    `;
                    container.appendChild(div);
                    renderSingleTable(index);
                    return;
                }
                container.appendChild(div);
            });
        }

        function renderSingleTable(blockIndex) {
            const block = currentBlocks[blockIndex];
            const tableEl = document.getElementById(`table-${blockIndex}`);
            if (!tableEl) return;

            let html = "<thead><tr>";
            block.headers.forEach((h, i) => {
                html += `<th contenteditable="true" onblur="updateHeader(${blockIndex}, ${i}, this.innerText)" class="bg-slate-100">${h}</th>`;
            });
            html += "</tr></thead><tbody>";
            block.rows.forEach((row, r) => {
                html += "<tr>";
                row.forEach((cell, c) => {
                    html += `<td contenteditable="true" onblur="updateCell(${blockIndex}, ${r}, ${c}, this.innerText)">${cell || ''}</td>`;
                });
                html += "</tr>";
            });
            html += "</tbody>";
            tableEl.innerHTML = html;
        }

        function updateTextBlock(index, value) {
            currentBlocks[index].content = value;
        }

        function updateTableTitle(index, value) {
            currentBlocks[index].title = value;
        }

        function updateHeader(blockIndex, col, text) {
            currentBlocks[blockIndex].headers[col] = text || "新欄位";
        }

        function updateCell(blockIndex, row, col, text) {
            currentBlocks[blockIndex].rows[row][col] = text;
        }

        function addTextBlock() {
            currentBlocks.push({ type: "text", content: "新文字方塊..." });
            renderAllBlocks();
        }

        function addNewTable() {
            currentBlocks.push({
                type: "table",
                title: "新表格",
                headers: ["項目", "數量", "備註"],
                rows: []
            });
            renderAllBlocks();
        }

        function addTableRow(blockIndex) {
            currentBlocks[blockIndex].rows.push(Array(currentBlocks[blockIndex].headers.length).fill(""));
            renderAllBlocks();
        }

        function addTableColumn(blockIndex) {
            const name = prompt("新欄位名稱", `欄位${currentBlocks[blockIndex].headers.length + 1}`);
            if (!name) return;
            currentBlocks[blockIndex].headers.push(name);
            currentBlocks[blockIndex].rows.forEach(row => row.push(""));
            renderAllBlocks();
        }

        function moveBlock(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentBlocks.length) return;
            [currentBlocks[index], currentBlocks[newIndex]] = [currentBlocks[newIndex], currentBlocks[index]];
            renderAllBlocks();
        }

        function deleteBlock(index) {
            if (!confirm("確定刪除此區塊？")) return;
            currentBlocks.splice(index, 1);
            renderAllBlocks();
        }

        function addSubpage() {
            const title = prompt("新分頁名稱", `新分頁 ${categories[currentCategoryIndex].subpages.length + 1}`);
            if (!title) return;

            categories[currentCategoryIndex].subpages.push({
                title: title,
                blocks: [
                    { type: "text", content: "在此輸入文字說明..." },
                    { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
                ]
            });

            renderSubpageList();
            selectSubpage(categories[currentCategoryIndex].subpages.length - 1);
        }

        function addCategory() {
            const name = prompt("新分類名稱", "新分類");
            if (!name) return;
            categories.push({ id: Date.now(), name: name, subpages: [] });
            renderCategoryList();
            selectCategory(categories.length - 1);
        }

        function saveCurrent() {
            if (currentSubpageIndex === -1) return;
            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            sub.title = document.getElementById("subpageTitle").value;
            sub.blocks = currentBlocks;
            saveAllData();
            alert("✅ 已儲存此分頁！重新整理後資料仍在。");
        }

        function deleteCurrentSubpage() {
            if (currentSubpageIndex === -1 || !confirm("確定刪除此分頁？")) return;
            categories[currentCategoryIndex].subpages.splice(currentSubpageIndex, 1);
            currentSubpageIndex = -1;
            document.getElementById("contentArea").classList.add("hidden");
            renderSubpageList();
            saveAllData();
        }

        function previewContent() {
            if (currentSubpageIndex === -1) return;
            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            let html = `<div class="prose">${sub.title}</div>`;

            currentBlocks.forEach(block => {
                if (block.type === "text") {
                    html += `<div class="mt-6">${block.content || ""}</div>`;
                } else if (block.type === "table") {
                    let tableHTML = `<div class="mt-8 font-medium">${block.title || '資料表格'}</div>`;
                    tableHTML += "<table class='w-full border-collapse mt-2 text-sm'>";
                    tableHTML += "<thead><tr>" + block.headers.map(h => `<th class='border p-3 bg-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                    block.rows.forEach(row => {
                        tableHTML += "<tr>" + row.map(cell => `<td class='border p-3'>${cell}</td>`).join("") + "</tr>";
                    });
                    tableHTML += "</tbody></table>";
                    html += tableHTML;
                }
            });

            document.getElementById("previewTitle").textContent = sub.title;
            document.getElementById("previewBody").innerHTML = html;
            document.getElementById("previewModal").classList.remove("hidden");
        }

        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        window.onload = () => {
            loadData();
            renderCategoryList();
            selectCategory(0);
        };
    </script>
</body>
</html>
