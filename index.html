<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO活動資料(可編輯)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 4px; }
        .nav-active { background-color: #1e40af; color: white; font-weight: 500; }
        td, th { padding: 12px; border: 1px solid #e2e8f0; text-align: left; }
        td[contenteditable="true"]:focus, th[contenteditable="true"]:focus { 
            outline: 2px solid #3b82f6; background-color: #f0f9ff; 
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden">
        <!-- 左側分類 -->
        <div class="w-72 bg-slate-900 text-white p-6 flex flex-col">
            <h1 class="text-2xl font-bold mb-8">NEO活動資料庫</h1>
            <div id="categoryList" class="flex-1 space-y-2"></div>
            <button onclick="addCategory()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl text-sm font-medium">+ 新增分類</button>
        </div>

        <!-- 中間分頁列表 -->
        <div class="w-80 bg-white border-r overflow-auto">
            <div class="sticky top-0 bg-white border-b p-5 flex justify-between items-center">
                <h3 class="font-medium">分頁列表</h3>
                <button onclick="addSubpage()" 
                        class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-3xl text-sm font-medium">
                    <span class="text-xl">+</span> 新增分頁
                </button>
            </div>
            <div id="subpageList" class="p-4"></div>
        </div>

        <!-- 右側內容 -->
        <div class="flex-1 flex flex-col">
            <div class="h-16 bg-white border-b flex items-center px-8">
                <h2 id="currentTitle" class="text-3xl font-bold">請選擇分頁</h2>
            </div>

            <div class="flex-1 p-8 overflow-auto bg-slate-50" id="contentArea">
                <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-xl p-8">
                    <input id="subpageTitle" class="w-full text-3xl font-bold border-b pb-4 focus:outline-none" placeholder="分頁標題" onblur="saveCurrent()">

                    <div id="contentBlocks" class="mt-10 space-y-12"></div>

                    <div class="mt-12 flex gap-4">
                        <button onclick="addTextBlock()" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 rounded-3xl text-sm font-medium">+ 新增文字方塊</button>
                        <button onclick="addNewTable()" class="flex-1 py-4 bg-slate-100 hover:bg-slate-200 rounded-3xl text-sm font-medium">+ 新增表格</button>
                    </div>
                </div>
            </div>

            <div class="h-16 bg-white border-t flex items-center px-8 gap-4">
                <button onclick="previewContent()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-3xl text-sm">預覽</button>
                <button onclick="saveCurrent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-3xl text-sm font-medium">💾 儲存此分頁</button>
                <button onclick="deleteCurrentSubpage()" class="text-red-500 hover:text-red-600 px-5 py-3 text-sm">🗑️ 刪除分頁</button>
            </div>
        </div>
    </div>

    <!-- 預覽彈窗 -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-auto">
            <div class="p-6 border-b flex justify-between sticky top-0 bg-white">
                <h3 id="previewTitle" class="text-2xl font-bold"></h3>
                <button onclick="closePreview()" class="text-3xl text-slate-400">×</button>
            </div>
            <div id="previewBody" class="p-8"></div>
        </div>
    </div>

    <script>
        let categories = [
            { id: 1, name: "通行證", subpages: [] },
            { id: 2, name: "金幣箱", subpages: [] },
            { id: 3, name: "華仲師兄", subpages: [] },
            { id: 4, name: "服裝箱", subpages: [] },
            { id: 5, name: "福利活動", subpages: [] },
            { id: 6, name: "排行活動", subpages: [] }
        ];

        let currentCategoryIndex = 0;
        let currentSubpageIndex = -1;
        let currentBlocks = [];

        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            if (saved) categories = JSON.parse(saved);
        }

        function saveAllData() {
            localStorage.setItem("gameDatabase", JSON.stringify(categories));
        }

        function renderCategoryList() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, i) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all ${i === currentCategoryIndex ? 'nav-active' : 'hover:bg-slate-800'}`;
                div.textContent = cat.name;
                div.onclick = () => selectCategory(i);
                container.appendChild(div);
            });
        }

        function selectCategory(index) {
            currentCategoryIndex = index;
            currentSubpageIndex = categories[index].subpages.length > 0 ? 0 : -1;
            renderCategoryList();
            renderSubpageList();
            if (currentSubpageIndex >= 0) selectSubpage(currentSubpageIndex);
        }

        function renderSubpageList() {
            const container = document.getElementById("subpageList");
            container.innerHTML = "";
            categories[currentCategoryIndex].subpages.forEach((sub, i) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer hover:bg-slate-100 ${i === currentSubpageIndex ? 'bg-blue-50 border-2 border-blue-500' : ''}`;
                div.textContent = sub.title;
                div.onclick = () => selectSubpage(i);
                container.appendChild(div);
            });
        }

        function selectSubpage(index) {
            currentSubpageIndex = index;
            const sub = categories[currentCategoryIndex].subpages[index];

            document.getElementById("currentTitle").textContent = sub.title;
            document.getElementById("subpageTitle").value = sub.title || "";

            currentBlocks = sub.blocks || [
                { type: "text", content: "請在此輸入文字說明..." },
                { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
            ];

            renderAllBlocks();
        }

        function renderAllBlocks() {
            const container = document.getElementById("contentBlocks");
            container.innerHTML = "";

            currentBlocks.forEach((block, i) => {
                const div = document.createElement("div");
                div.className = "border rounded-3xl p-6 bg-white relative";

                div.innerHTML += `
                    <div class="absolute -top-3 -right-3 flex gap-1 bg-white shadow rounded-xl p-1">
                        <button onclick="moveBlock(${i}, -1)" class="w-8 h-8 hover:bg-slate-100 rounded-lg">↑</button>
                        <button onclick="moveBlock(${i}, 1)" class="w-8 h-8 hover:bg-slate-100 rounded-lg">↓</button>
                        <button onclick="deleteBlock(${i})" class="w-8 h-8 text-red-500 hover:bg-red-50 rounded-lg">×</button>
                    </div>
                `;

                if (block.type === "text") {
                    div.innerHTML += `<textarea class="w-full h-56 p-6 border rounded-3xl text-lg" onblur="updateText(${i}, this.value)">${block.content || ""}</textarea>`;
                } else if (block.type === "table") {
                    div.innerHTML += `
                        <input value="${block.title || '資料表格'}" class="text-xl font-medium border-b focus:outline-none w-80 mb-4" onblur="updateTableTitle(${i}, this.value)">
                        <div class="flex gap-3 mb-4">
                            <button onclick="addTableRow(${i})" class="bg-slate-100 hover:bg-slate-200 px-6 py-2 rounded-3xl text-sm">+ 新增列</button>
                            <button onclick="addTableColumn(${i})" class="bg-slate-100 hover:bg-slate-200 px-6 py-2 rounded-3xl text-sm">+ 新增欄</button>
                        </div>
                        <table class="w-full border" id="table-${i}"></table>
                    `;
                    container.appendChild(div);
                    renderSingleTable(i);
                    return;
                }
                container.appendChild(div);
            });
        }

        function renderSingleTable(index) {
            const block = currentBlocks[index];
            const el = document.getElementById(`table-${index}`);
            if (!el) return;

            let html = "<thead><tr>";
            block.headers.forEach((h, c) => {
                html += `<th contenteditable="true" onblur="updateHeader(${index}, ${c}, this.innerText)" class="bg-slate-100">${h}</th>`;
            });
            html += "</tr></thead><tbody>";
            block.rows.forEach((row, r) => {
                html += "<tr>";
                row.forEach((cell, c) => {
                    html += `<td contenteditable="true" onblur="updateCell(${index}, ${r}, ${c}, this.innerText)">${cell || ''}</td>`;
                });
                html += "</tr>";
            });
            html += "</tbody>";
            el.innerHTML = html;
        }

        function updateText(i, val) { currentBlocks[i].content = val; }
        function updateTableTitle(i, val) { currentBlocks[i].title = val; }
        function updateHeader(blockIdx, col, text) { currentBlocks[blockIdx].headers[col] = text || "新欄位"; }
        function updateCell(blockIdx, row, col, text) { currentBlocks[blockIdx].rows[row][col] = text; }

        function addTextBlock() {
            currentBlocks.push({ type: "text", content: "" });
            renderAllBlocks();
        }

        function addNewTable() {
            currentBlocks.push({
                type: "table",
                title: "新表格",
                headers: ["項目", "數量", "備註"],
                rows: []
            });
            renderAllBlocks();
        }

        function addTableRow(blockIdx) {
            currentBlocks[blockIdx].rows.push(Array(currentBlocks[blockIdx].headers.length).fill(""));
            renderAllBlocks();
        }

        function addTableColumn(blockIdx) {
            const name = prompt("新欄位名稱", `欄位 ${currentBlocks[blockIdx].headers.length + 1}`);
            if (!name) return;
            currentBlocks[blockIdx].headers.push(name);
            currentBlocks[blockIdx].rows.forEach(r => r.push(""));
            renderAllBlocks();
        }

        function moveBlock(index, dir) {
            const newIndex = index + dir;
            if (newIndex < 0 || newIndex >= currentBlocks.length) return;
            [currentBlocks[index], currentBlocks[newIndex]] = [currentBlocks[newIndex], currentBlocks[index]];
            renderAllBlocks();
        }

        function deleteBlock(index) {
            if (!confirm("確定刪除這個區塊嗎？")) return;
            currentBlocks.splice(index, 1);
            renderAllBlocks();
        }

        function addSubpage() {
            const title = prompt("新分頁名稱", `分頁 ${categories[currentCategoryIndex].subpages.length + 1}`);
            if (!title) return;

            categories[currentCategoryIndex].subpages.push({
                title: title,
                blocks: [
                    { type: "text", content: "請在此輸入文字說明..." },
                    { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
                ]
            });

            renderSubpageList();
            selectSubpage(categories[currentCategoryIndex].subpages.length - 1);
        }

        function addCategory() {
            const name = prompt("新分類名稱", "新分類");
            if (!name) return;
            categories.push({ id: Date.now(), name: name, subpages: [] });
            renderCategoryList();
            selectCategory(categories.length - 1);
        }

        function saveCurrent() {
            if (currentSubpageIndex === -1) return;
            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            sub.title = document.getElementById("subpageTitle").value;
            sub.blocks = currentBlocks;
            saveAllData();
            alert("✅ 已儲存！");
        }

        function deleteCurrentSubpage() {
            if (currentSubpageIndex === -1 || !confirm("確定刪除此分頁？")) return;
            categories[currentCategoryIndex].subpages.splice(currentSubpageIndex, 1);
            currentSubpageIndex = -1;
            document.getElementById("contentArea").classList.add("hidden");
            renderSubpageList();
            saveAllData();
        }

        function previewContent() {
            if (currentSubpageIndex === -1) return;
            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            let html = `<h2 class="text-2xl font-bold mb-6">${sub.title}</h2>`;

            currentBlocks.forEach(block => {
                if (block.type === "text") {
                    html += `<div class="mt-6 prose">${block.content || ""}</div>`;
                } else if (block.type === "table") {
                    let t = `<div class="mt-8 font-medium">${block.title || "資料表格"}</div>`;
                    t += "<table class='w-full border-collapse mt-3 text-sm'>";
                    t += "<thead><tr>" + block.headers.map(h => `<th class='border p-3 bg-slate-100'>${h}</th>`).join("") + "</tr></thead><tbody>";
                    block.rows.forEach(row => t += "<tr>" + row.map(cell => `<td class='border p-3'>${cell}</td>`).join("") + "</tr>");
                    t += "</tbody></table>";
                    html += t;
                }
            });

            document.getElementById("previewTitle").innerHTML = html;
            document.getElementById("previewModal").classList.remove("hidden");
        }

        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        // 初始化
        window.onload = () => {
            loadData();
            renderCategoryList();
            if (categories[0].subpages.length > 0) {
                selectSubpage(0);
            } else {
                selectCategory(0);
            }
        };
    </script>
</body>
</html>
