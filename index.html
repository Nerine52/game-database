<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO資料庫(編輯版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .image-preview { max-height: 50px; width: 50px; object-fit: contain; border-radius: 6px; display: block; margin: 0 auto; }
    .nav-active { background-color: #1e40af; color: white; font-weight: 500; }
    
    table { 
        width: 100%; 
        border-collapse: collapse; 
        table-layout: auto; 
    }
    th, td { 
        padding: 12px; 
        border: 1px solid #334155; 
        text-align: center; 
        vertical-align: middle;
        white-space: pre-wrap;
    }
    th { background-color: #1e2937; font-weight: 500; }

    .text-small { font-size: 14px; line-height: 1.6; }
    .text-medium { font-size: 16px; line-height: 1.7; }
    .text-large { font-size: 20px; line-height: 1.6; }

    /* === 新增：Markdown 預覽樣式（修正重點）=== */
    .prose h1 { font-size: 2.25rem; font-weight: 700; margin: 1.25em 0 0.5em; }
    .prose h2 { font-size: 1.875rem; font-weight: 600; margin: 1.25em 0 0.5em; }
    .prose h3 { font-size: 1.5rem; font-weight: 600; margin: 1em 0 0.5em; }
    .prose p { margin: 1em 0; line-height: 1.7; }
    .prose ul { list-style-type: disc; padding-left: 1.5em; margin: 1em 0; }
    .prose ol { list-style-type: decimal; padding-left: 1.5em; margin: 1em 0; }
    .prose li { margin: 0.25em 0; }
    .prose strong { font-weight: 700; }
    .prose em { font-style: italic; }
    .prose a { color: #60a5fa; text-decoration: underline; }
    .prose code { background-color: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .prose pre { background-color: #1e2937; padding: 1em; border-radius: 8px; overflow-x: auto; margin: 1em 0; }

    /* 浮動按鈕樣式 */
    #floatingToggleBtn:hover {
        transform: scale(1.1) translateY(-50%);
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
    }
        
</style>
</head>
<body class="bg-slate-950 text-slate-200">
    <div class="flex h-screen overflow-hidden">
        
<!-- 左側分類 -->
    <div id="leftPanel" class="bg-slate-900 text-white p-6 flex flex-col transition-all duration-300 overflow-hidden" style="width: 288px;">
        <h1 class="text-2xl font-bold mb-8">NEO資料庫</h1>
        <div id="categoryList" class="flex-1 space-y-2"></div>
        <button onclick="addCategory()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-2xl text-sm font-medium">+ 新增分類</button>
    </div>

        <!-- 中間分頁列表 -->
        <div id="middlePanel" class="bg-slate-900 border-r border-slate-700 overflow-hidden transition-all duration-300 flex flex-col" style="width: 320px;">
            <div class="sticky top-0 bg-slate-900 border-b border-slate-700 p-4 flex items-center justify-between">
                <h3 id="middleTitle" class="font-medium">分頁列表</h3>
                <div class="flex items-center gap-2">
                    <button onclick="addSubpage()" id="addSubpageBtn"
                            class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-3xl text-sm font-medium">
                        <span class="text-xl">+</span> 新增
                    </button>
                    <button onclick="toggleSidebar()" id="toggleBtn"
                            class="text-slate-400 hover:text-slate-300 text-sm font-medium flex items-center gap-1 px-3 py-2 rounded-2xl hover:bg-slate-800">
                        收合 <span class="text-lg">→</span>
                    </button>
                </div>
            </div>
            <div id="subpageList" class="flex-1 p-4 overflow-auto"></div>
        </div>

        <!-- 右側內容 -->
        <div class="flex-1 flex flex-col">
            <div class="h-16 bg-slate-900 border-b border-slate-700 flex items-center px-8 justify-between">
                <h2 id="currentTitle" class="text-3xl font-bold">請選擇分頁</h2>
                <button onclick="exportForPublic()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-3xl text-sm font-medium flex items-center gap-2">
                    ☁️ 匯出給公開版
                </button>
            </div>

            <div class="flex-1 p-8 overflow-auto bg-slate-950" id="contentArea">
                <div class="max-w-5xl mx-auto bg-slate-900 rounded-3xl shadow-xl p-8">
                    <input id="subpageTitle" class="w-full text-3xl font-bold border-b border-slate-600 pb-4 focus:outline-none bg-transparent text-white" placeholder="分頁標題" onblur="saveCurrent()">

                    <div id="contentBlocks" class="mt-10 space-y-12"></div>

                    <div class="mt-12 flex gap-4">
                        <button onclick="addTextBlock()" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">+ 新增文字方塊 (Markdown)</button>
                        <button onclick="addNewTable()" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">+ 新增表格</button>
                    </div>
                </div>
            </div>
            
<!-- 底部工具列 -->
            <div class="h-16 bg-slate-900 border-t border-slate-700 flex items-center px-8 gap-4 flex-wrap">
                <button onclick="showMarkdownHelp()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-3xl text-sm">Markdown 101</button>
                <button onclick="previewContent()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-3xl text-sm">預覽 Markdown</button>
                
                <button onclick="exportData()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-3xl text-sm font-medium flex items-center gap-2">
                    📤 匯出資料
                </button>
                <button onclick="importData()" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-3xl text-sm font-medium flex items-center gap-2">
                    📥 匯入資料
                </button>
                <button onclick="saveCurrent()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-3xl text-sm font-medium">💾 儲存此分頁</button>
                <button onclick="deleteCurrentSubpage()" class="text-red-500 hover:text-red-600 px-5 py-3 text-sm">🗑️ 刪除分頁</button>
            </div>
        </div>
    </div>

    <!-- 浮動展開/收合按鈕（正確位置：必須在 flex 容器外面！） -->
    <button onclick="toggleSidebar()" id="floatingToggleBtn"
            class="hidden fixed left-4 top-1/2 -translate-y-1/2 bg-slate-800 hover:bg-slate-700 text-white w-14 h-14 rounded-3xl shadow-2xl flex items-center justify-center text-3xl z-[9999] transition-all duration-300 border border-slate-600">
        <span id="floatIcon">→</span>
    </button>

    <!-- Markdown 教學彈窗 -->
    <div id="markdownHelp" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-slate-900 rounded-3xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-auto">
            <div class="p-6 border-b border-slate-700 sticky top-0 bg-slate-900 flex justify-between">
                <h3 class="text-xl font-bold">Markdown 語法快速參考</h3>
                <button onclick="closeMarkdownHelp()" class="text-3xl text-slate-400">×</button>
            </div>
            <div class="p-8 prose prose-invert max-w-none text-slate-300 text-sm">
                <table class="w-full border-collapse">
                    <tr><td>**粗體**</td><td><strong>粗體</strong></td></tr>
                    <tr><td>*斜體*</td><td><em>斜體</em></td></tr>
                    <tr><td># 大標題</td><td>大標題</td></tr>
                    <tr><td>## 中標題</td><td>中標題</td></tr>
                    <tr><td>- 列表項目</td><td>• 列表項目</td></tr>
                    <tr><td>[文字](連結)</td><td>超連結</td></tr>
                    <tr><td>![描述](圖片網址)</td><td>插入圖片</td></tr>
                </table>
            </div>
        </div>
    </div>

    <!-- 預覽彈窗 -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-slate-900 rounded-3xl w-full max-w-4xl mx-4 max-h-[90vh] overflow-auto">
            <div class="p-6 border-b border-slate-700 flex justify-between sticky top-0 bg-slate-900">
                <h3 id="previewTitle" class="text-2xl font-bold text-white"></h3>
                <button onclick="closePreview()" class="text-3xl text-slate-400">×</button>
            </div>
            <div id="previewBody" class="p-8 prose prose-invert max-w-none"></div>
        </div>
    </div>

    <script>
        let categories = [
            { id: 1, name: "通行證", subpages: [] },
            { id: 2, name: "金幣箱", subpages: [] },
            { id: 3, name: "華仲師兄", subpages: [] },
            { id: 4, name: "服裝箱", subpages: [] },
            { id: 5, name: "福利活動", subpages: [] },
            { id: 6, name: "排行活動", subpages: [] }
        ];

        let currentCategoryIndex = 0;
        let currentSubpageIndex = -1;
        let currentBlocks = [];
        let isSidebarVisible = true;   // 同時控制左側 + 中間面板
        
        function loadData() {
            const saved = localStorage.getItem("gameDatabase");
            if (saved) categories = JSON.parse(saved);
        }

        function saveAllData() {
            localStorage.setItem("gameDatabase", JSON.stringify(categories));
        }

        // 自動儲存（切換前呼叫）
        function saveCurrent() {
            if (currentSubpageIndex === -1) return;
            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            sub.title = document.getElementById("subpageTitle").value;
            sub.blocks = currentBlocks;
            saveAllData();
        }

        function renderCategoryList() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, i) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all ${i === currentCategoryIndex ? 'nav-active' : 'hover:bg-slate-800'}`;
                div.textContent = cat.name;
                div.onclick = () => selectCategory(i);
                container.appendChild(div);
            });
        }

        function selectCategory(index) {
            if (currentSubpageIndex >= 0) saveCurrent();   // ← 自動儲存
            currentCategoryIndex = index;
            currentSubpageIndex = categories[index].subpages.length > 0 ? 0 : -1;
            renderCategoryList();
            renderSubpageList();
            if (currentSubpageIndex >= 0) selectSubpage(currentSubpageIndex);
        }

        function renderSubpageList() {
            const container = document.getElementById("subpageList");
            container.innerHTML = "";

            const subpages = categories[currentCategoryIndex].subpages || [];
            subpages.forEach((sub, i) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer hover:bg-slate-800 ${i === currentSubpageIndex ? 'bg-slate-700' : ''}`;
                div.textContent = sub.title;
                div.onclick = () => selectSubpage(i);
                container.appendChild(div);
            });

            if (subpages.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400">此分類還沒有分頁<br>請點擊上方「+ 新增分頁」</div>`;
            }
        }

        function selectSubpage(index) {
            if (currentSubpageIndex >= 0 && currentSubpageIndex !== index) saveCurrent();   // ← 自動儲存
            currentSubpageIndex = index;
            const sub = categories[currentCategoryIndex].subpages[index];
            document.getElementById("currentTitle").textContent = sub.title;
            document.getElementById("subpageTitle").value = sub.title || "";

            currentBlocks = JSON.parse(JSON.stringify(sub.blocks || [   // 深拷貝避免參考問題
                { type: "text", content: "請在此輸入文字說明...\n\n支援 **Markdown** 語法", fontSize: "medium" },
                { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
            ]));

            renderAllBlocks();
        }

        function toggleSidebar() {
            isSidebarVisible = !isSidebarVisible;
            const leftPanel = document.getElementById("leftPanel");
            const middlePanel = document.getElementById("middlePanel");
            const title = document.getElementById("middleTitle");
            const addBtn = document.getElementById("addSubpageBtn");
            const floatBtn = document.getElementById("floatingToggleBtn");
            const icon = document.getElementById("floatIcon");

            if (isSidebarVisible) {
                // 展開
                leftPanel.style.width = "288px";
                middlePanel.style.width = "320px";
                title.style.display = "block";
                addBtn.style.display = "flex";
                floatBtn.classList.add("hidden");
            } else {
                // 完全收合，只留浮動按鈕
                leftPanel.style.width = "0";
                middlePanel.style.width = "0";
                title.style.display = "none";
                addBtn.style.display = "none";
                floatBtn.classList.remove("hidden");
                icon.textContent = "←";
            }
        }

        function renderAllBlocks() {
            const container = document.getElementById("contentBlocks");
            container.innerHTML = "";

            currentBlocks.forEach((block, i) => {
                const div = document.createElement("div");
                div.className = "border border-slate-700 rounded-3xl p-6 bg-slate-900 relative";

                div.innerHTML += `
                    <div class="absolute -top-3 -right-3 flex gap-1 bg-slate-800 shadow rounded-xl p-1">
                        <button onclick="moveBlock(${i}, -1)" class="w-8 h-8 hover:bg-slate-700 rounded-lg text-slate-300">↑</button>
                        <button onclick="moveBlock(${i}, 1)" class="w-8 h-8 hover:bg-slate-700 rounded-lg text-slate-300">↓</button>
                        <button onclick="deleteBlock(${i})" class="w-8 h-8 text-red-400 hover:bg-red-900/30 rounded-lg">×</button>
                    </div>
                `;

                if (block.type === "text") {
                    const fontClass = block.fontSize === "small" ? "text-small" : block.fontSize === "large" ? "text-large" : "text-medium";
                    div.innerHTML += `
                        <div class="flex justify-between items-center mb-3">
                            <div class="text-xs text-slate-400">支援 Markdown 語法</div>
                            <div class="flex gap-1">
                                <button onclick="changeFontSize(${i}, 'small')" class="px-3 py-1 text-xs rounded-lg ${block.fontSize==='small' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600'}">小</button>
                                <button onclick="changeFontSize(${i}, 'medium')" class="px-3 py-1 text-xs rounded-lg ${block.fontSize==='medium' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600'}">中</button>
                                <button onclick="changeFontSize(${i}, 'large')" class="px-3 py-1 text-xs rounded-lg ${block.fontSize==='large' ? 'bg-blue-600 text-white' : 'bg-slate-700 hover:bg-slate-600'}">大</button>
                            </div>
                        </div>
                        <textarea id="text-${i}" class="w-full h-64 p-6 border border-slate-700 rounded-3xl bg-slate-950 text-slate-200 resize-y ${fontClass}" onblur="updateText(${i}, this.value)">${block.content || ""}</textarea>
                    `;
                } else if (block.type === "table") {
                    div.innerHTML += `
                        <input value="${block.title || '資料表格'}" class="text-xl font-medium border-b border-slate-700 focus:outline-none w-80 mb-4 bg-transparent" onblur="updateTableTitle(${i}, this.value)">
                        <div class="flex gap-3 mb-4 flex-wrap">
                            <button onclick="addTableRow(${i})" class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-3xl text-sm">+ 新增列</button>
                            <button onclick="addTableColumn(${i})" class="bg-slate-800 hover:bg-slate-700 px-6 py-2 rounded-3xl text-sm">+ 新增欄</button>
                            <button onclick="deleteLastRow(${i})" class="bg-red-700 hover:bg-red-600 px-6 py-2 rounded-3xl text-sm">刪除最後一列</button>
                            <button onclick="deleteLastColumn(${i})" class="bg-red-700 hover:bg-red-600 px-6 py-2 rounded-3xl text-sm">刪除最後一欄</button>
                            <button onclick="mergeFirstColumn(${i})" class="bg-blue-700 hover:bg-blue-600 px-6 py-2 rounded-3xl text-sm">垂直合併第一欄</button>
                        </div>
                        <table class="w-full border border-slate-700" id="table-${i}"></table>
                    `;
                    container.appendChild(div);
                    renderSingleTable(i);
                    return;
                }
                container.appendChild(div);
            });
        }

        function changeFontSize(blockIndex, size) {
            currentBlocks[blockIndex].fontSize = size;
            renderAllBlocks();
        }

        // 正確處理 rowspan 的渲染（核心修正）
        function renderSingleTable(index) {
            const block = currentBlocks[index];
            const el = document.getElementById(`table-${index}`);
            if (!el) return;

            let html = "<thead><tr>";
            block.headers.forEach((h, c) => {
                html += `<th contenteditable="true" onblur="updateHeader(${index},${c}, this.innerText)" class="bg-slate-800">${h}</th>`;
            });
            html += "</tr></thead><tbody>";

            let r = 0;
            while (r < block.rows.length) {
                html += "<tr>";

                for (let c = 0; c < block.headers.length; c++) {
                    // 如果是第一欄且被上方 rowspan 涵蓋，則跳過此格（正確 rowspan 寫法）
                    if (c === 0 && isCoveredByRowspan(block, r)) {
                        continue;
                    }

                    let cell = block.rows[r][c] || '';
                    let content = cell.replace(/\n/g, '<br>');
                    let rowspan = 1;

                    if (c === 0 && typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                        const match = cell.match(/【ROWSPAN:(\d+)】(.*)/);
                        if (match) {
                            rowspan = parseInt(match[1]);
                            content = match[2] || '';
                        }
                    }

                    html += `<td rowspan="${rowspan}" contenteditable="true" 
                              onblur="updateCell(${index},${r},${c}, this.innerText)" 
                              style="white-space: pre-wrap; vertical-align: middle;">${content}</td>`;
                }
                html += "</tr>";
                r++;
            }
            html += "</tbody>";
            el.innerHTML = html;
        }

        // 判斷某列是否被上方 rowspan 涵蓋
        function isCoveredByRowspan(block, rowIdx) {
            let r = 0;
            while (r < rowIdx) {
                const cell = block.rows[r][0];
                if (typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                    const match = cell.match(/【ROWSPAN:(\d+)】/);
                    if (match) {
                        const span = parseInt(match[1]);
                        if (r + span > rowIdx) return true;
                    }
                }
                r++;
            }
            return false;
        }

        function updateCell(blockIdx, row, col, text) {
            const block = currentBlocks[blockIdx];
            if (col === 0 && typeof block.rows[row][0] === 'string' && block.rows[row][0].startsWith('【ROWSPAN:')) {
                const match = block.rows[row][0].match(/【ROWSPAN:\d+】/);
                if (match) {
                    block.rows[row][0] = match[0] + text;
                    return;
                }
            }
            block.rows[row][col] = text;
        }

        function updateText(i, val) { currentBlocks[i].content = val; }
        function updateTableTitle(i, val) { currentBlocks[i].title = val; }
        function updateHeader(blockIdx, col, text) { currentBlocks[blockIdx].headers[col] = text || "新欄位"; }

        function addTextBlock() {
            currentBlocks.push({ type: "text", content: "", fontSize: "medium" });
            renderAllBlocks();
        }

        function addNewTable() {
            currentBlocks.push({
                type: "table",
                title: "新表格",
                headers: ["項目", "數量", "備註"],
                rows: []
            });
            renderAllBlocks();
        }

        function addTableRow(blockIdx) {
            currentBlocks[blockIdx].rows.push(Array(currentBlocks[blockIdx].headers.length).fill(""));
            renderAllBlocks();
        }

        function addTableColumn(blockIdx) {
            const name = prompt("新欄位名稱", `欄位 ${currentBlocks[blockIdx].headers.length + 1}`);
            if (!name) return;
            currentBlocks[blockIdx].headers.push(name);
            currentBlocks[blockIdx].rows.forEach(r => r.push(""));
            renderAllBlocks();
        }

        function deleteLastRow(blockIdx) {
            if (!confirm("確定刪除最後一列嗎？")) return;
            const block = currentBlocks[blockIdx];
            if (block.rows.length === 0) return;
            block.rows.pop();
            renderAllBlocks();
        }

        function deleteLastColumn(blockIdx) {
            if (!confirm("確定刪除最後一欄嗎？")) return;
            const block = currentBlocks[blockIdx];
            if (block.headers.length <= 1) {
                alert("至少要保留一欄！");
                return;
            }
            block.headers.pop();
            block.rows.forEach(row => row.pop());
            renderAllBlocks();
        }

        function mergeFirstColumn(blockIdx) {
            const block = currentBlocks[blockIdx];
            if (block.rows.length < 2) {
                alert("至少要有兩列才能合併！");
                return;
            }
            const num = prompt("要從第一列開始向下合併幾列？（例如輸入 5 就會合併第1~5列的第一欄）", "5");
            if (!num) return;

            const rowspan = parseInt(num);
            if (isNaN(rowspan) || rowspan < 2 || rowspan > block.rows.length) {
                alert("輸入的列數無效！");
                return;
            }

            let originalContent = block.rows[0][0] || '';
            block.rows[0][0] = `【ROWSPAN:${rowspan}】${originalContent}`;

            for (let i = 1; i < rowspan; i++) {
                block.rows[i][0] = '';
            }

            alert(`✅ 已將第一欄從第1列到第${rowspan}列垂直合併！`);
            renderAllBlocks();
        }

        function moveBlock(index, dir) {
            const newIndex = index + dir;
            if (newIndex < 0 || newIndex >= currentBlocks.length) return;
            [currentBlocks[index], currentBlocks[newIndex]] = [currentBlocks[newIndex], currentBlocks[index]];
            renderAllBlocks();
        }

        function deleteBlock(index) {
            if (!confirm("確定刪除這個區塊嗎？")) return;
            currentBlocks.splice(index, 1);
            renderAllBlocks();
        }

        function addSubpage() {
            const title = prompt("新分頁名稱", `分頁 ${categories[currentCategoryIndex].subpages.length + 1}`);
            if (!title) return;

            categories[currentCategoryIndex].subpages.push({
                title: title,
                blocks: [
                    { type: "text", content: "請在此輸入文字說明...\n\n支援 **Markdown** 語法", fontSize: "medium" },
                    { type: "table", title: "資料表格", headers: ["項目", "數量", "備註"], rows: [] }
                ]
            });

            renderSubpageList();
            selectSubpage(categories[currentCategoryIndex].subpages.length - 1);
        }

        function addCategory() {
            const name = prompt("新分類名稱", "新分類");
            if (!name) return;
            categories.push({ id: Date.now(), name: name, subpages: [] });
            renderCategoryList();
            selectCategory(categories.length - 1);
        }

        function deleteCurrentSubpage() {
            if (currentSubpageIndex === -1 || !confirm("確定刪除此分頁？")) return;
            
            categories[currentCategoryIndex].subpages.splice(currentSubpageIndex, 1);
            currentSubpageIndex = -1;
            document.getElementById("currentTitle").textContent = "請選擇分頁";
            document.getElementById("subpageTitle").value = "";
            document.getElementById("contentBlocks").innerHTML = "";
            renderSubpageList();
            saveAllData();
        }

        function previewContent() {
            if (currentSubpageIndex === -1) return;
            saveCurrent();   // 預覽前先儲存

            const sub = categories[currentCategoryIndex].subpages[currentSubpageIndex];
            let html = `<h2 class="text-3xl font-bold mb-8">${sub.title}</h2>`;

            currentBlocks.forEach(block => {
                if (block.type === "text") {
                    const sizeStyle = block.fontSize === "small" ? "font-size:14px;line-height:1.6;" 
                                   : block.fontSize === "large" ? "font-size:20px;line-height:1.6;" 
                                   : "font-size:16px;line-height:1.7;";
                    html += `<div class="prose prose-invert max-w-none mb-10" style="${sizeStyle}">${marked.parse(block.content || "")}</div>`;
                } else if (block.type === "table") {
                    let t = `<div class="mt-8 font-medium">${block.title || "資料表格"}</div>`;
                    t += "<table class='w-full border-collapse mt-4 text-sm'>";
                    t += "<thead><tr>" + block.headers.map(h => `<th class='border border-slate-600 p-3 bg-slate-800'>${h}</th>`).join("") + "</tr></thead><tbody>";

                    let r = 0;
                    while (r < block.rows.length) {
                        t += "<tr>";
                        for (let c = 0; c < block.headers.length; c++) {
                            if (c === 0 && isCoveredByRowspan(block, r)) continue;
                            let cell = block.rows[r][c] || '';
                            let content = cell.replace(/\n/g, '<br>');
                            let rowspan = 1;
                            if (c === 0 && typeof cell === 'string' && cell.startsWith('【ROWSPAN:')) {
                                const match = cell.match(/【ROWSPAN:(\d+)】(.*)/);
                                if (match) {
                                    rowspan = parseInt(match[1]);
                                    content = match[2] || '';
                                }
                            }
                            t += `<td rowspan="${rowspan}" class='border border-slate-600 p-3 text-center' style="vertical-align: middle;">${content}</td>`;
                        }
                        t += "</tr>";
                        r++;
                    }
                    t += "</tbody></table>";
                    html += t;
                }
            });
    
            document.getElementById("previewTitle").textContent = sub.title;
            document.getElementById("previewBody").innerHTML = html;
            document.getElementById("previewModal").classList.remove("hidden");
        }

        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        function showMarkdownHelp() {
            document.getElementById("markdownHelp").classList.remove("hidden");
        }

        function closeMarkdownHelp() {
            document.getElementById("markdownHelp").classList.add("hidden");
        }

        function exportData() {
            saveCurrent();
            const dataStr = JSON.stringify(categories, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "public-data.json";
            a.click();
            URL.revokeObjectURL(url);
            alert("✅ 已下載 public-data.json\n請上傳到 GitHub 覆蓋原有檔案");
        }

        function importData() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json";
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        categories = JSON.parse(event.target.result);
                        saveAllData();
                        renderCategoryList();
                        selectCategory(0);
                        alert("✅ 資料匯入成功！");
                    } catch(err) {
                        alert("❌ 檔案格式錯誤，請確認是 public-data.json");
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function exportForPublic() {
            exportData();
        }

        window.onload = () => {
            loadData();
            renderCategoryList();
            if (categories[0].subpages.length > 0) {
                selectCategory(0);
            } else {
                selectCategory(0);
            }
        };
    </script>
</body>
</html>
