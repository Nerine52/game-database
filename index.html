<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的遊戲資料庫 - Nerine52</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .image-preview { max-height: 420px; object-fit: contain; border-radius: 16px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .nav-active { background-color: #1e40af; color: white; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- 左側分類選單 -->
        <div class="w-72 bg-slate-900 text-white p-6 flex flex-col">
            <h1 class="text-2xl font-bold mb-8">🎮 我的遊戲資料庫</h1>
            
            <div class="space-y-2 flex-1" id="categoryList">
                <!-- JS 會自動產生 6 個分類 -->
            </div>
            
            <div class="text-xs text-slate-400 mt-auto pt-6">
                圖片來自：game-images<br>
                使用者：Nerine52
            </div>
        </div>

        <!-- 右側內容區 -->
        <div class="flex-1 flex flex-col">
            <div class="h-16 bg-white border-b flex items-center px-8">
                <h2 id="currentCategory" class="text-3xl font-bold">請選擇左側分類</h2>
            </div>
            
            <div class="flex-1 p-8 overflow-auto">
                <textarea id="editor" class="w-full h-full p-8 border border-slate-300 rounded-3xl text-lg resize-none focus:outline-none focus:border-blue-400" 
                          placeholder="在這裡輸入文字與圖片程式碼..."></textarea>
            </div>
            
            <div class="h-16 bg-white border-t flex items-center px-8 gap-4">
                <button onclick="preview()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-3xl">預覽效果</button>
                <button onclick="saveNote()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-3xl">儲存此分頁內容</button>
            </div>
        </div>
    </div>

    <!-- 預覽彈窗 -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-auto">
            <div class="p-8" id="previewContent"></div>
            <div class="p-6 border-t flex justify-end">
                <button onclick="closePreview()" class="px-8 py-3 border rounded-3xl">關閉預覽</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            {name: "通行證", folder: "通行證"},
            {name: "金幣箱", folder: "金幣箱"},
            {name: "華仲師兄", folder: "華仲師兄"},
            {name: "服裝箱", folder: "服裝箱"},
            {name: "福利活動", folder: "福利活動"},
            {name: "排行活動", folder: "排行活動"}
        ];

        let currentCatIndex = 0;
        let notes = {}; // 儲存每個分類的內容

        function renderCategories() {
            const container = document.getElementById("categoryList");
            container.innerHTML = "";
            categories.forEach((cat, index) => {
                const div = document.createElement("div");
                div.className = `px-6 py-4 rounded-2xl cursor-pointer transition-all ${index === currentCatIndex ? 'nav-active' : 'hover:bg-slate-800'}`;
                div.textContent = cat.name;
                div.onclick = () => {
                    currentCatIndex = index;
                    renderCategories();
                    document.getElementById("currentCategory").textContent = cat.name;
                    document.getElementById("editor").value = notes[cat.name] || `這是 ${cat.name} 的內容區\n\n可以在這裡貼入圖片，例如：\n<img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/${cat.folder}/你的圖片檔名.jpg" class="image-preview w-full mt-6" alt="${cat.name}">`;
                };
                container.appendChild(div);
            });
        }

        function preview() {
            const content = document.getElementById("editor").value;
            document.getElementById("previewContent").innerHTML = `
                <h2 class="text-2xl font-bold mb-6">${categories[currentCatIndex].name}</h2>
                <div class="prose prose-slate max-w-none">${content}</div>
            `;
            document.getElementById("previewModal").classList.remove("hidden");
        }

        function closePreview() {
            document.getElementById("previewModal").classList.add("hidden");
        }

        function saveNote() {
            const catName = categories[currentCatIndex].name;
            notes[catName] = document.getElementById("editor").value;
            alert(`✅ 已儲存「${catName}」的內容！\n\n（目前儲存在瀏覽器，下次開啟相同裝置仍可看到）`);
        }

        // 初始化
        window.onload = () => {
            renderCategories();
            // 預設顯示第一個分類
            document.getElementById("currentCategory").textContent = categories[0].name;
            document.getElementById("editor").value = `歡迎使用遊戲資料庫！\n\n請點擊左側分類開始編輯。\n\n圖片範例（把「你的圖片檔名.jpg」改成實際檔名）：\n<img src="https://cdn.jsdelivr.net/gh/Nerine52/game-images@main/images/通行證/你的圖片檔名.jpg" class="image-preview w-full mt-6" alt="範例圖片">`;
        };
    </script>
</body>
</html>
